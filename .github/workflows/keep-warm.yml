name: Keep Render service warm

# Render free tier усыпляет сервис после ~15 минут простоя, а холодный старт
# занимает ~20 секунд — дольше, чем ждёт ответа ChatGPT Actions. Пользователь
# при этом видит ClientResponseError даже на /health и /date, то есть на
# эндпоинтах без авторизации, и это выглядит как поломка сервиса, хотя сервис
# исправен и просто спал.
#
# Почему одного cron мало. Расписание GitHub Actions — не гарантия интервала,
# а заявка в общую очередь: при "*/10 * * * *" фактические интервалы в этом
# репозитории составляли 29-54 минуты (замерено 18.08.2026 по истории
# запусков). Это заведомо больше 15-минутного порога Render, поэтому сервис
# засыпал между пингами, сколько бы часто ни был прописан cron.
#
# Поэтому пингуем не один раз за запуск, а в цикле изнутри задания: один
# запуск держит сервис тёплым почти час независимо от того, когда GitHub
# соизволит запустить следующий. Репозиторий публичный — минуты Actions
# не тарифицируются.
#
# Это обходной путь, а не решение. Настоящее решение — платный инстанс
# Render, который не засыпает вовсе; тогда этот workflow можно удалить.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Новый запуск отменяет предыдущий: два параллельных цикла пинга бессмысленны,
# а без отмены они копились бы при плавающем расписании.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Чуть больше длительности цикла — чтобы задание не убили посередине.
    timeout-minutes: 60
    steps:
      - name: Ping /health в цикле
        env:
          URL: https://china-securities-proxy.onrender.com/health
          # 12 пингов с шагом 4.5 минуты ≈ 54 минуты покрытия. Шаг заведомо
          # меньше 15-минутного порога Render, с запасом на задержку ответа.
          ROUNDS: 12
          INTERVAL_SECONDS: 270
        run: |
          fail=0
          for i in $(seq 1 "$ROUNDS"); do
            # --max-time с запасом на холодный старт: если сервис всё же успел
            # уснуть, этот запрос его будит, и будить должен именно пинг, а не
            # живой пользователь.
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo "curl_error")
            elapsed=$(( (i - 1) * INTERVAL_SECONDS / 60 ))
            echo "[$i/$ROUNDS, +${elapsed}м] HTTP $status"
            if [ "$status" != "200" ]; then
              fail=$((fail + 1))
              echo "::warning::Пинг $i вернул HTTP $status"
            fi
            if [ "$i" -lt "$ROUNDS" ]; then
              sleep "$INTERVAL_SECONDS"
            fi
          done

          echo "Неуспешных пингов: $fail из $ROUNDS"
          # Единичный сбой — обычное дело (деплой, перезапуск инстанса) и не
          # повод красить прогон в красный. Систематический — уже сигнал.
          if [ "$fail" -gt 3 ]; then
            echo "::error::Сервис не отвечал в $fail пингах из $ROUNDS — проверь Render"
            exit 1
          fi
