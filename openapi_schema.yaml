openapi: 3.1.0
info:
  title: China Securities Data Proxy
  description: >-
    REST API-обёртка над AKShare для доступа к финансовой отчётности,
    дивидендам, дневным котировкам и валютным курсам China A-share (SSE/SZSE)
    и Hong Kong (HKEX) тикеров.
  version: 1.0.0
servers:
  - url: https://china-securities-proxy.onrender.com
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /income:
    get:
      operationId: getIncomeStatement
      summary: Отчёт о прибылях и убытках A-share тикера
      parameters:
        - $ref: "#/components/parameters/tsCode"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /balancesheet:
    get:
      operationId: getBalanceSheet
      summary: Баланс A-share тикера
      parameters:
        - $ref: "#/components/parameters/tsCode"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /cashflow:
    get:
      operationId: getCashFlow
      summary: Отчёт о движении денежных средств A-share тикера
      parameters:
        - $ref: "#/components/parameters/tsCode"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /dividend:
    get:
      operationId: getDividendHistory
      summary: История дивидендов A-share тикера
      parameters:
        - $ref: "#/components/parameters/tsCode"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /daily:
    get:
      operationId: getDailyQuotesAShare
      summary: Дневные котировки A-share тикера
      parameters:
        - $ref: "#/components/parameters/tsCode"
        - $ref: "#/components/parameters/startDate"
        - $ref: "#/components/parameters/endDate"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /hk_daily:
    get:
      operationId: getDailyQuotesHK
      summary: Дневные котировки HK тикера (формат тикера без суффикса .HK, напр. "00267")
      parameters:
        - $ref: "#/components/parameters/tsCode"
        - $ref: "#/components/parameters/startDate"
        - $ref: "#/components/parameters/endDate"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /hk_financial:
    get:
      operationId: getFinancialsHK
      summary: Финансовые показатели HK тикера
      parameters:
        - $ref: "#/components/parameters/tsCode"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /fx:
    get:
      operationId: getFxRateHistory
      summary: История официальной котировки Банка Китая для валюты к CNY
      parameters:
        - name: currency
          in: query
          required: false
          description: >-
            Китайское название валюты, напр. "港币" (HKD), "美元" (USD),
            "欧元" (EUR). По умолчанию "港币".
          schema:
            type: string
            default: 港币
        - $ref: "#/components/parameters/startDate"
        - $ref: "#/components/parameters/endDate"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /fx_cny_hkd_on_date:
    get:
      operationId: getFxRateCnyHkdOnDate
      summary: >-
        Официальная котировка Банка Китая (BOC) CNY/HKD на конкретную дату
        (прямая котировка, не кросс-расчёт)
      parameters:
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: Котировка на дату вместе с указанием источника и методологии
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
                  source:
                    type: string
                  methodology:
                    type: string
        "502":
          $ref: "#/components/responses/UpstreamError"
  /stock_basic:
    get:
      operationId: getStockBasicInfo
      summary: Базовая информация о тикере (A-share)
      parameters:
        - $ref: "#/components/parameters/tsCode"
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /forecast/em/{symbol}:
    get:
      operationId: getForecastEastmoney
      summary: >-
        Консенсус-прогноз аналитиков Eastmoney (东财) по A-share тикеру.
        Только A-share, код без биржевого суффикса (напр. "601939").
      parameters:
        - $ref: "#/components/parameters/forecastSymbol"
      responses:
        "200":
          $ref: "#/components/responses/ForecastResponse"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /forecast/ths/{symbol}:
    get:
      operationId: getForecastThs
      summary: >-
        Консенсус-прогноз аналитиков Tonghuashun/同花顺 по A-share тикеру.
        Только A-share, код без биржевого суффикса (напр. "601939").
      parameters:
        - $ref: "#/components/parameters/forecastSymbol"
        - name: indicator
          in: query
          required: false
          description: >-
            Раздел прогноза THS. Один из: "预测年报每股收益",
            "预测年报净利润", "业绩预测详表-机构", "业绩预测详表-详细指标预测"
            (по умолчанию). Значение должно совпадать ТОЧНО, иначе будет
            пустой результат.
          schema:
            type: string
            default: 业绩预测详表-详细指标预测
      responses:
        "200":
          $ref: "#/components/responses/ForecastResponse"
        "400":
          description: Неверное значение indicator
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "502":
          $ref: "#/components/responses/UpstreamError"
  /forecast/hk/{symbol}:
    get:
      operationId: getForecastHk
      summary: >-
        Консенсус-прогноз аналитиков ET Net/经济通 по гонконгскому тикеру
        (основной источник прогнозов для HK-бумаг, напр. BOC/CCB/CITIC).
        Код без суффикса .HK, ведущие нули не обязательны (напр. "939",
        "3988", "267").
      parameters:
        - $ref: "#/components/parameters/forecastSymbol"
        - name: indicator
          in: query
          required: false
          description: >-
            Раздел прогноза ET Net. Один из: "评级总览",
            "去年度业绩表现", "综合盈利预测" (по умолчанию), "盈利预测概览".
          schema:
            type: string
            default: 综合盈利预测
      responses:
        "200":
          $ref: "#/components/responses/ForecastResponse"
        "400":
          description: Неверное значение indicator
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "502":
          $ref: "#/components/responses/UpstreamError"
  /forecast/aggregate/{symbol}:
    get:
      operationId: getForecastAggregate
      summary: >-
        Собирает все применимые источники прогноза консенсуса по одному
        тикеру за один вызов: Eastmoney и Tonghuashun — если symbol похож
        на A-share (6 цифр); ET Net — если передан hk_symbol, либо сам
        symbol гонконгский.
      parameters:
        - $ref: "#/components/parameters/forecastSymbol"
        - name: hk_symbol
          in: query
          required: false
          description: >-
            Гонконгский код тикера, если он отличается от symbol (напр.
            когда symbol — это A-share код, а нужен ещё и HK-прогноз по
            двойному листингу A+H).
          schema:
            type: string
      responses:
        "200":
          description: >-
            Объект с ключом sources, где для каждого применимого источника
            (eastmoney / 10jqka / etnet) — свой ответ в формате как у
            соответствующего одиночного эндпоинта, либо {"error": "..."}
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  sources:
                    type: object
        "400":
          description: Не удалось определить ни один применимый источник
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
components:
  parameters:
    tsCode:
      name: ts_code
      in: query
      required: true
      description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
      schema:
        type: string
    startDate:
      name: start_date
      in: query
      required: true
      description: Дата начала периода в формате YYYY-MM-DD
      schema:
        type: string
    endDate:
      name: end_date
      in: query
      required: true
      description: Дата конца периода в формате YYYY-MM-DD
      schema:
        type: string
    forecastSymbol:
      name: symbol
      in: path
      required: true
      description: >-
        Код тикера без биржевого суффикса. Для A-share — 6 цифр (напр.
        "601939"). Для HK — код без .HK, ведущие нули не обязательны
        (напр. "939" эквивалентно "00939").
      schema:
        type: string
  responses:
    ForecastResponse:
      description: >-
        Прогноз консенсуса аналитиков либо found:false, если по данному
        тикеру нет покрытия у этого источника
      content:
        application/json:
          schema:
            type: object
            properties:
              source:
                type: string
              symbol:
                type: string
              found:
                type: boolean
              note:
                type: string
              data:
                type: array
                items:
                  type: object
    DataResponse:
      description: Успешный ответ с данными или пустым результатом
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
              note:
                type: string
    UpstreamError:
      description: Ошибка при обращении к источнику данных (AKShare)
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
