openapi: 3.1.0
info:
  title: China Securities Data Proxy
  description: >-
    REST API-обёртка над AKShare для доступа к финансовой отчётности,
    дивидендам, дневным котировкам и валютным курсам China A-share (SSE/SZSE)
    и Hong Kong (HKEX) тикеров.
  version: 1.0.0
servers:
  - url: https://china-securities-proxy.onrender.com
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /date:
    get:
      operationId: getServerDate
      summary: >-
        Сегодняшняя дата по часам сервера. Вызывай её перед любым разбором
        актуальности данных: собственная дата модели ненадёжна, и без этого
        прогнозы на уже прошедшие годы можно принять за актуальные.
      responses:
        "200":
          description: Текущая дата и время сервера (UTC)
          content:
            application/json:
              schema:
                type: object
                properties:
                  today:
                    type: string
                    description: Дата в формате YYYY-MM-DD
                  year:
                    type: integer
                  datetime_utc:
                    type: string
  /income:
    get:
      operationId: getIncomeStatement
      summary: Отчёт о прибылях и убытках A-share тикера
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /balancesheet:
    get:
      operationId: getBalanceSheet
      summary: Баланс A-share тикера
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /cashflow:
    get:
      operationId: getCashFlow
      summary: Отчёт о движении денежных средств A-share тикера
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /dividend:
    get:
      operationId: getDividendHistory
      summary: История дивидендов A-share тикера
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /daily:
    get:
      operationId: getDailyQuotesAShare
      summary: Дневные котировки A-share тикера
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: Дата начала периода в формате YYYY-MM-DD
          schema:
            type: string
        - name: end_date
          in: query
          required: true
          description: Дата конца периода в формате YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /hk_daily:
    get:
      operationId: getDailyQuotesHK
      summary: >-
        Дневные котировки HK тикера (формат тикера без суффикса .HK, напр.
        "00267"). Для периодов от ~2 лет и больше используйте interval=weekly
        или monthly/yearly — daily-ответ на несколько лет может быть очень
        большим и медленным.
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: Дата начала периода в формате YYYY-MM-DD
          schema:
            type: string
        - name: end_date
          in: query
          required: true
          description: Дата конца периода в формате YYYY-MM-DD
          schema:
            type: string
        - name: interval
          in: query
          required: false
          description: >-
            Агрегация OHLCV: "daily" (по умолчанию, вся история по дням —
            для многолетних периодов ответ большой), "weekly", "monthly"
            или "yearly" (одна строка на период: open первого дня, high/low
            экстремумы, close последнего дня, volume/amount — сумма).
          schema:
            type: string
            default: daily
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /hk_financial:
    get:
      operationId: getFinancialsHK
      summary: Финансовые показатели HK тикера
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /fx:
    get:
      operationId: getFxRateHistory
      summary: История официальной котировки Банка Китая для валюты к CNY
      parameters:
        - name: currency
          in: query
          required: false
          description: >-
            Китайское название валюты, напр. "港币" (HKD), "美元" (USD),
            "欧元" (EUR). По умолчанию "港币".
          schema:
            type: string
            default: 港币
        - name: start_date
          in: query
          required: true
          description: Дата начала периода в формате YYYY-MM-DD
          schema:
            type: string
        - name: end_date
          in: query
          required: true
          description: Дата конца периода в формате YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /fx_cny_hkd_on_date:
    get:
      operationId: getFxRateCnyHkdOnDate
      summary: >-
        Официальная котировка Банка Китая (BOC) CNY/HKD на конкретную дату
        (прямая котировка, не кросс-расчёт)
      parameters:
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: Котировка на дату вместе с указанием источника и методологии
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
                  source:
                    type: string
                  methodology:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /stock_basic:
    get:
      operationId: getStockBasicInfo
      summary: Базовая информация о тикере (A-share)
      parameters:
        - name: ts_code
          in: query
          required: true
          description: Тикер (суффиксы .SH/.SZ/.HK будут очищены автоматически)
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными или пустым результатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /forecast/em/{symbol}:
    get:
      operationId: getForecastEastmoney
      summary: >-
        Консенсус-прогноз аналитиков Eastmoney (东财) по A-share тикеру.
        Только A-share, код без биржевого суффикса (напр. "601939").
      parameters:
        - name: symbol
          in: path
          required: true
          description: >-
            Код тикера без биржевого суффикса. Для A-share — 6 цифр (напр.
            "601939"). Для HK — код без .HK, ведущие нули не обязательны
            (напр. "939" эквивалентно "00939").
          schema:
            type: string
        - name: include_past
          in: query
          required: false
          description: >-
            По умолчанию false — возвращаются только прогнозы на текущий год
            и последующие, уже прошедшие годы отфильтровываются. true — вернуть
            всё, включая устаревшие периоды; запрашивай только если пользователь
            явно просит исторические прогнозы.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            Прогноз консенсуса аналитиков либо found:false, если по данному
            тикеру нет покрытия у этого источника
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  symbol:
                    type: string
                  today:
                    type: string
                    description: >-
                      Сегодняшняя дата по часам сервера (YYYY-MM-DD). Считай
                      её текущей датой, а не ту, что модель помнит сама.
                  retrieved_at:
                    type: string
                    description: >-
                      Момент получения данных из источника (ISO 8601, UTC).
                      Цитируй его как дату данных; никогда не подставляй
                      прогнозные цифры по памяти модели.
                  dropped_past_periods:
                    type: array
                    description: >-
                      Периоды, отброшенные как уже прошедшие (по умолчанию
                      возвращаются только прогнозы на текущий год и позже).
                    items:
                      type: string
                  found:
                    type: boolean
                  note:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /forecast/ths/{symbol}:
    get:
      operationId: getForecastThs
      summary: >-
        Консенсус-прогноз аналитиков Tonghuashun/同花顺 по A-share тикеру.
        Только A-share, код без биржевого суффикса (напр. "601939").
      parameters:
        - name: symbol
          in: path
          required: true
          description: >-
            Код тикера без биржевого суффикса. Для A-share — 6 цифр (напр.
            "601939"). Для HK — код без .HK, ведущие нули не обязательны
            (напр. "939" эквивалентно "00939").
          schema:
            type: string
        - name: indicator
          in: query
          required: false
          description: >-
            Раздел прогноза THS. Один из: "预测年报每股收益",
            "预测年报净利润", "业绩预测详表-机构", "业绩预测详表-详细指标预测"
            (по умолчанию). Значение должно совпадать ТОЧНО, иначе будет
            пустой результат.
          schema:
            type: string
            default: 业绩预测详表-详细指标预测
        - name: include_past
          in: query
          required: false
          description: >-
            По умолчанию false — возвращаются только прогнозы на текущий год
            и последующие, уже прошедшие годы отфильтровываются. true — вернуть
            всё, включая устаревшие периоды; запрашивай только если пользователь
            явно просит исторические прогнозы.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            Прогноз консенсуса аналитиков либо found:false, если по данному
            тикеру нет покрытия у этого источника
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  symbol:
                    type: string
                  today:
                    type: string
                    description: >-
                      Сегодняшняя дата по часам сервера (YYYY-MM-DD). Считай
                      её текущей датой, а не ту, что модель помнит сама.
                  retrieved_at:
                    type: string
                    description: >-
                      Момент получения данных из источника (ISO 8601, UTC).
                      Цитируй его как дату данных; никогда не подставляй
                      прогнозные цифры по памяти модели.
                  dropped_past_periods:
                    type: array
                    description: >-
                      Периоды, отброшенные как уже прошедшие (по умолчанию
                      возвращаются только прогнозы на текущий год и позже).
                    items:
                      type: string
                  found:
                    type: boolean
                  note:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
        "400":
          description: Неверное значение indicator
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /forecast/hk/{symbol}:
    get:
      operationId: getForecastHk
      summary: >-
        Консенсус-прогноз аналитиков ET Net/经济通 по гонконгскому тикеру
        (основной источник прогнозов для HK-бумаг, напр. BOC/CCB/CITIC).
        Код без суффикса .HK, ведущие нули не обязательны (напр. "939",
        "3988", "267").
      parameters:
        - name: symbol
          in: path
          required: true
          description: >-
            Код тикера без биржевого суффикса. Для A-share — 6 цифр (напр.
            "601939"). Для HK — код без .HK, ведущие нули не обязательны
            (напр. "939" эквивалентно "00939").
          schema:
            type: string
        - name: indicator
          in: query
          required: false
          description: >-
            Раздел прогноза ET Net. Один из: "评级总览",
            "去年度业绩表现", "综合盈利预测" (по умолчанию), "盈利预测概览".
          schema:
            type: string
            default: 综合盈利预测
        - name: include_past
          in: query
          required: false
          description: >-
            По умолчанию false — возвращаются только прогнозы на текущий год
            и последующие, уже прошедшие годы отфильтровываются. true — вернуть
            всё, включая устаревшие периоды; запрашивай только если пользователь
            явно просит исторические прогнозы.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            Прогноз консенсуса аналитиков либо found:false, если по данному
            тикеру нет покрытия у этого источника
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  symbol:
                    type: string
                  today:
                    type: string
                    description: >-
                      Сегодняшняя дата по часам сервера (YYYY-MM-DD). Считай
                      её текущей датой, а не ту, что модель помнит сама.
                  retrieved_at:
                    type: string
                    description: >-
                      Момент получения данных из источника (ISO 8601, UTC).
                      Цитируй его как дату данных; никогда не подставляй
                      прогнозные цифры по памяти модели.
                  dropped_past_periods:
                    type: array
                    description: >-
                      Периоды, отброшенные как уже прошедшие (по умолчанию
                      возвращаются только прогнозы на текущий год и позже).
                    items:
                      type: string
                  found:
                    type: boolean
                  note:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
        "400":
          description: Неверное значение indicator
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "502":
          description: Ошибка при обращении к источнику данных (AKShare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /forecast/aggregate/{symbol}:
    get:
      operationId: getForecastAggregate
      summary: >-
        Собирает все применимые источники прогноза консенсуса по одному
        тикеру за один вызов: Eastmoney и Tonghuashun — если symbol похож
        на A-share (6 цифр); ET Net — если передан hk_symbol, либо сам
        symbol гонконгский.
      parameters:
        - name: symbol
          in: path
          required: true
          description: >-
            Код тикера без биржевого суффикса. Для A-share — 6 цифр (напр.
            "601939"). Для HK — код без .HK, ведущие нули не обязательны
            (напр. "939" эквивалентно "00939").
          schema:
            type: string
        - name: hk_symbol
          in: query
          required: false
          description: >-
            Гонконгский код тикера, если он отличается от symbol (напр.
            когда symbol — это A-share код, а нужен ещё и HK-прогноз по
            двойному листингу A+H).
          schema:
            type: string
        - name: include_past
          in: query
          required: false
          description: >-
            По умолчанию false — возвращаются только прогнозы на текущий год
            и последующие, уже прошедшие годы отфильтровываются. true — вернуть
            всё, включая устаревшие периоды; запрашивай только если пользователь
            явно просит исторические прогнозы.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            Объект с ключом sources, где для каждого применимого источника
            (eastmoney / 10jqka / etnet) — свой ответ в формате как у
            соответствующего одиночного эндпоинта, либо {"error": "..."}
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  today:
                    type: string
                    description: >-
                      Сегодняшняя дата по часам сервера (YYYY-MM-DD). Считай
                      её текущей датой, а не ту, что модель помнит сама.
                  retrieved_at:
                    type: string
                  sources:
                    type: object
        "400":
          description: Не удалось определить ни один применимый источник
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /consensus/aastocks/{symbol}:
    get:
      operationId: getConsensusAastocks
      summary: >-
        Manual/low-frequency use only — не для автоматического опроса.
        Консенсус-прогнозы брокеров (rating, target price) по HK-тикеру,
        собранные из research-заметок AASTOCKS.com. Ожидается 1-2 запуска
        в год на несколько тикеров, не подключён к keep-warm пингу.
      parameters:
        - name: symbol
          in: path
          required: true
          description: >-
            Код тикера HKEX без суффикса .HK, ведущие нули не обязательны
            (напр. "939" эквивалентно "00939").
          schema:
            type: string
      responses:
        "200":
          description: >-
            Список research-заметок с брокером, рейтингом и target price
            (эвристическое извлечение из свободного текста — сверяйте с
            полями headline/raw_snippet), либо found:false, если подходящих
            заметок не найдено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  symbol:
                    type: string
                  today:
                    type: string
                    description: >-
                      Сегодняшняя дата по часам сервера (YYYY-MM-DD). Считай
                      её текущей датой, а не ту, что модель помнит сама.
                  retrieved_at:
                    type: string
                    description: >-
                      Момент получения данных из источника (ISO 8601, UTC).
                      Цитируй его как дату данных; никогда не подставляй
                      прогнозные цифры по памяти модели.
                  dropped_past_periods:
                    type: array
                    description: >-
                      Периоды, отброшенные как уже прошедшие (по умолчанию
                      возвращаются только прогнозы на текущий год и позже).
                    items:
                      type: string
                  found:
                    type: boolean
                  note:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        broker:
                          type: string
                        headline:
                          type: string
                        rating:
                          type: string
                        target_price_old:
                          type: number
                        target_price_new:
                          type: number
                        date:
                          type: string
                        source_url:
                          type: string
                        raw_snippet:
                          type: string
        "502":
          description: Сбой апстрима (сеть) или изменение структуры страницы AASTOCKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                  error_type:
                    type: string
                  endpoint:
                    type: string
                  message:
                    type: string
                  retryable:
                    type: boolean
