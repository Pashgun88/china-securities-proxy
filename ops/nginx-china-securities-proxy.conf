server {
    server_name china.paveln8n.cloud;

    # Ответы отчётности бывают в сотни КБ; буферы по умолчанию малы и
    # заставляют nginx писать их во временные файлы на каждый запрос.
    proxy_buffers 16 32k;
    proxy_buffer_size 32k;

    # Апстримы (AKShare, Yahoo, ET Net) иногда отвечают долго, а расширение
    # окна прогнозов делает несколько последовательных запросов подряд.
    proxy_read_timeout 120s;
    proxy_connect_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заголовок авторизации должен дойти до приложения без изменений.
        proxy_pass_request_headers on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/china.paveln8n.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/china.paveln8n.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = china.paveln8n.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name china.paveln8n.cloud;

    listen 80;
    return 404; # managed by Certbot


}